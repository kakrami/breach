<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=2.15.0">
<link rel="stylesheet" href="ui.css?v=2.15.0">
<title>Breach v2.15.0</title>
</head>
<body>
<canvas id="game" aria-label="Breach gameplay" draggable="false"></canvas>
<canvas id="uiCanvas" aria-label="Breach menus. Arrow keys move, Enter selects, Escape goes back." draggable="false" tabindex="0"></canvas>
<script>
// Startup and failure messages are painted even if the game module cannot load.
(() => {
  const canvas=document.getElementById('uiCanvas'),ctx=canvas.getContext('2d');
  const paint=message=>{const dpr=Math.min(3,devicePixelRatio||1),w=innerWidth,h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#080b0d';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='#c3f66b';ctx.font='700 28px system-ui';ctx.fillText('BREACH',w/2,h/2-24);ctx.fillStyle='#c7cdca';ctx.font='14px system-ui';ctx.fillText(message,w/2,h/2+16,Math.max(120,w-40));};
  paint('Preparing menus…');
  window.__breachModuleBooted=false;
  window.__breachCanvasBootFailure=message=>paint(message||'Client failed to start. Reload to try again.');
  window.addEventListener('error',event=>{if(!window.__breachModuleBooted)paint('Client failed to start. Reload to try again.');});
  window.addEventListener('unhandledrejection',()=>{if(!window.__breachModuleBooted)paint('Client failed to start. Reload to try again.');});
  for(const type of ['contextmenu','selectstart','dragstart'])document.addEventListener(type,event=>{event.preventDefault();},{capture:true,passive:false});
  import('./client.js?v=2.15.0').catch(error=>{console.error(error);paint('Client failed to start. Reload to try again.');});
})();
</script>
</body>
</html>
